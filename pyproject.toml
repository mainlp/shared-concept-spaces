[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "clap"
version = "0.1.0"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
lint.select = ["E", "F", "B"]
lint.ignore = ["E501"]
